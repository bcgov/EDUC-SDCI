name: Build & Deploy to DEV and TEST

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Branch to promote to test (default: main)'
        required: false
        default: 'main'

jobs:
  # ========================================================================================
  # JOB 1: BUILD AND DEPLOY TO DEV
  # Logic taken directly from: build-n-deploy-backend-to-ocp-dev.yml
  # ========================================================================================
  build-and-deploy-dev:
    name: Build and deploy to DEV
    runs-on: ubuntu-22.04
    environment: dev
    outputs:
      ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
      SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}
    
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      OPENSHIFT_NAMESPACE: ${{ secrets.SDCI_NAMESPACE_NO_ENV }}-dev
      CA_CERT: ${{ secrets.CA_CERT }}
      CERTIFICATE: ${{ secrets.CERT }}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      CLEAR_FILES_KEY: ${{secrets.CLEAR_FILES_KEY}}
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_REGISTRY_USER: ${{ github.actor }}
      IMAGE_REGISTRY_PASSWORD: ${{ github.token }}
      IMAGE_NAME: sdci-backend-main
      DOCKER_ARTIFACTORY_REPO: artifacts.developer.gov.bc.ca/docker-remote
      ARTIFACTORY_REPO: artifacts.developer.gov.bc.ca
      APP_NAME: "sdci"
      REPO_NAME: "educ-sdci"
      BRANCH: "main"
      APP_NAME_BACKEND: "sdci-backend-main"
      APP_NAME_FRONTEND: "sdci-frontend"
      APP_NAME_FRONTEND_MAIN: "sdci-frontend-main"
      APP_NAME_FRONTEND_STATIC: "sdci-frontend-static"
      NAMESPACE: ${{ secrets.SDCI_NAMESPACE_NO_ENV }}
      COMMON_NAMESPACE: ${{ secrets.COMMON_NAMESPACE_NO_ENV }}
      TAG: "latest"
      MIN_REPLICAS: "3"
      MAX_REPLICAS: "4"
      MIN_CPU: "50m"
      MAX_CPU: "100m"
      MIN_MEM: "200Mi"
      MAX_MEM: "250Mi"
      HOST_ROUTE: ${{ secrets.SITE_URL }}

    steps:
      - name: Check for required secrets
        uses: actions/github-script@v6
        with:
          script: |
            const secrets = {
              OPENSHIFT_SERVER: `${{ secrets.OPENSHIFT_SERVER }}`,
              OPENSHIFT_TOKEN: `${{ secrets.OPENSHIFT_TOKEN }}`,
            };
            const GHCR = "ghcr.io";
            if (`${{ env.IMAGE_REGISTRY }}`.startsWith(GHCR)) {
              core.info(`Image registry is ${GHCR} - no registry password required`);
            }
            else {
              core.info("A registry password is required");
              secrets["IMAGE_REGISTRY_PASSWORD"] = `${{ secrets.IMAGE_REGISTRY_PASSWORD }}`;
            }
            const missingSecrets = Object.entries(secrets).filter(([ name, value ]) => {
              if (value.length === 0) {
                core.error(`Secret "${name}" is not set`);
                return true;
              }
              core.info(`✔️ Secret "${name}" is set`);
              return false;
            });
            if (missingSecrets.length > 0) {
              core.setFailed(`❌ At least one required secret is not set in the repository.`);
            }
            else {
              core.info(`✅ All the required secrets are set`);
            }

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Determine app name
        if: env.APP_NAME_BACKEND == ''
        run: |
          echo "APP_NAME_BACKEND=$(basename $PWD)" | tee -a $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v1
        with:
          registry: ${{ env.DOCKER_ARTIFACTORY_REPO }}
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build backend from Dockerfile
        id: build-image-backend
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.APP_NAME_BACKEND }}
          tags: "latest"
          dockerfiles: |
            ./backend/Dockerfile
          context: ./backend

      - name: Push backend to registry
        id: push-image-backend
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image-backend.outputs.image }}
          tags: ${{ steps.build-image-backend.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY_USER }}
          password: ${{ env.IMAGE_REGISTRY_PASSWORD }}

      - name: Build frontend from Dockerfile
        id: build-image-frontend
        uses: redhat-actions/buildah-build@v2
        with:
          image: ${{ env.APP_NAME_FRONTEND }}
          tags: "latest"
          dockerfiles: |
            ./frontend/Dockerfile
          context: ./frontend

      - name: Push frontend to registry
        id: push-image-frontend
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image-frontend.outputs.image }}
          tags: ${{ steps.build-image-frontend.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ env.IMAGE_REGISTRY_USER }}
          password: ${{ env.IMAGE_REGISTRY_PASSWORD }}

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4

      - uses: actions/checkout@v3
      - name: Deploy
        run: |
          set -eux
          oc login --token=${{ env.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
          oc project ${{ env.OPENSHIFT_NAMESPACE }}
          
          # Cancel any rollouts in progress
          oc rollout cancel deployment/${{ env.IMAGE_NAME }} 2> /dev/null || true
          
          # Create image streams
          oc create imagestream ${{ env.REPO_NAME }}-backend-${{ env.BRANCH }} 2> /dev/null || true
          oc create imagestream ${{ env.REPO_NAME }}-frontend-static 2> /dev/null || true
          
          # Tag images
          oc tag ${{ steps.push-image-backend.outputs.registry-path }} ${{ env.REPO_NAME }}-backend-${{ env.BRANCH }}:${{ env.TAG }}
          oc tag ${{ steps.push-image-frontend.outputs.registry-path }} ${{ env.REPO_NAME }}-frontend-static:${{ env.TAG }}
          
          # Process templates
          oc process -f tools/openshift/backend.deployment.yaml -p APP_NAME=${{ env.APP_NAME }} -p REPO_NAME=${{ env.REPO_NAME }} -p BRANCH=${{ env.BRANCH }} -p NAMESPACE=${{ env.OPENSHIFT_NAMESPACE }} -p TAG=${{ env.TAG }} -p MIN_REPLICAS=${{ env.MIN_REPLICAS }} -p MAX_REPLICAS=${{ env.MAX_REPLICAS }} -p MIN_CPU=${{ env.MIN_CPU }} -p MAX_CPU=${{ env.MAX_CPU }} -p MIN_MEM=${{ env.MIN_MEM }} -p MAX_MEM=${{ env.MAX_MEM }} -p HOST_ROUTE=${{ env.HOST_ROUTE }} | oc apply -f -
          
          oc process -f tools/openshift/frontend-static.deployment.yaml -p APP_NAME=${{ env.APP_NAME }} -p REPO_NAME=${{ env.REPO_NAME }} -p BRANCH=${{ env.BRANCH }} -p NAMESPACE=${{ env.OPENSHIFT_NAMESPACE }} -p TAG=${{ env.TAG }} -p MIN_REPLICAS=${{ env.MIN_REPLICAS }} -p MAX_REPLICAS=${{ env.MAX_REPLICAS }} -p MIN_CPU=${{ env.MIN_CPU }} -p MAX_CPU=${{ env.MAX_CPU }} -p MIN_MEM=${{ env.MIN_MEM }} -p MAX_MEM=${{ env.MAX_MEM }} -p HOST_ROUTE=${{ env.HOST_ROUTE }} -p CA_CERT="${{ env.CA_CERT }}" -p CERTIFICATE="${{ env.CERTIFICATE }}" -p PRIVATE_KEY="${{ env.PRIVATE_KEY }}" | oc apply -f -
          
          bash tools/config/update-configmap.sh dev ${{ env.APP_NAME }} ${{ env.NAMESPACE }} ${{env.COMMON_NAMESPACE}} ${{secrets.KC_CLIENT_ID}} ${{secrets.KC_CLIENT_SECRET}} ${{secrets.KC_TOKEN_URL}} ${{secrets.CLEAR_FILES_KEY}} ${{ env.HOST_ROUTE}}
          
          oc rollout restart deployment/${{ env.IMAGE_NAME }} 2> /dev/null || true
          oc rollout restart deployment/${{ env.APP_NAME_FRONTEND_MAIN }} 2> /dev/null || true
          
          oc rollout status deployment/${{ env.IMAGE_NAME }}

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: "https://${{ env.HOST_ROUTE }}"

  # ========================================================================================
  # JOB 2: PROMOTE AND DEPLOY TO TEST
  # Logic taken directly from: deploy-to.openshift-test.yml
  # ========================================================================================
  deploy-to-test:
    name: Build and deploy to TEST
    runs-on: ubuntu-22.04
    environment: test
    needs: build-and-deploy-dev  # <--- Ensures this runs only after Dev succeeds
    outputs:
      ROUTE: ${{ steps.deploy-and-expose.outputs.route }}
      SELECTOR: ${{ steps.deploy-and-expose.outputs.selector }}
      
    env:
      OPENSHIFT_SERVER: ${{ secrets.OPENSHIFT_SERVER }}
      OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
      OPENSHIFT_NAMESPACE: ${{ secrets.SDCI_NAMESPACE_NO_ENV }}-test
      CA_CERT: ${{ secrets.CA_CERT }}
      CERTIFICATE: ${{ secrets.CERT }}
      CLEAR_FILES_KEY: ${{secrets.CLEAR_FILES_KEY}}
      PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
      IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}
      IMAGE_REGISTRY_USER: ${{ github.actor }}
      IMAGE_REGISTRY_PASSWORD: ${{ github.token }}
      IMAGE_NAME: sdci-backend-main
      DOCKER_ARTIFACTORY_REPO: artifacts.developer.gov.bc.ca/docker-remote
      ARTIFACTORY_REPO: artifacts.developer.gov.bc.ca
      APP_NAME: "sdci"
      REPO_NAME: "educ-sdci"
      # Uses input if provided, otherwise defaults to main
      BRANCH: ${{ inputs.target_branch || 'main' }}
      APP_NAME_BACKEND: "sdci-backend-main"
      APP_NAME_FRONTEND: "sdci-frontend"
      APP_NAME_FRONTEND_MAIN: "sdci-frontend-main"
      APP_NAME_FRONTEND_STATIC: "sdci-frontend-static"
      NAMESPACE: ${{ secrets.SDCI_NAMESPACE_NO_ENV }}
      COMMON_NAMESPACE: ${{ secrets.COMMON_NAMESPACE_NO_ENV }}
      TAG: "latest"
      MIN_CPU: "50m"
      MAX_CPU: "100m"
      MIN_MEM: "200Mi"
      MAX_MEM: "250Mi"
      MIN_REPLICAS: "3"
      MAX_REPLICAS: "4"
      HOST_ROUTE: ${{ secrets.SITE_URL }}

    steps:
      - name: Check for required secrets
        uses: actions/github-script@v6
        with:
          script: |
            const secrets = {
              OPENSHIFT_SERVER: `${{ secrets.OPENSHIFT_SERVER }}`,
              OPENSHIFT_TOKEN: `${{ secrets.OPENSHIFT_TOKEN }}`,
            };
            const GHCR = "ghcr.io";
            if (`${{ env.IMAGE_REGISTRY }}`.startsWith(GHCR)) {
              core.info(`Image registry is ${GHCR} - no registry password required`);
            }
            else {
              core.info("A registry password is required");
              secrets["IMAGE_REGISTRY_PASSWORD"] = `${{ secrets.IMAGE_REGISTRY_PASSWORD }}`;
            }
            const missingSecrets = Object.entries(secrets).filter(([ name, value ]) => {
              if (value.length === 0) {
                core.error(`Secret "${name}" is not set`);
                return true;
              }
              core.info(`✔️ Secret "${name}" is set`);
              return false;
            });
            if (missingSecrets.length > 0) {
              core.setFailed(`❌ At least one required secret is not set in the repository.`);
            }
            else {
              core.info(`✅ All the required secrets are set`);
            }

      - name: Check out repository
        uses: actions/checkout@v3

      - name: Get latest tag
        uses: actions-ecosystem/action-get-latest-tag@v1
        id: get-latest-tag

      - name: Install oc
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: 4

      - uses: actions/checkout@v3
      - name: Deploy
        run: |
          set -eux
          oc login --token=${{ env.OPENSHIFT_TOKEN }} --server=${{ env.OPENSHIFT_SERVER }}
          oc project ${{ env.OPENSHIFT_NAMESPACE }}
          
          # Cancel any rollouts in progress
          oc rollout cancel deployment/${{ env.IMAGE_NAME }} 2> /dev/null || true

          # Promote images from DEV to TEST (using the tag found by get-latest-tag)
          oc tag ${{ env.NAMESPACE }}-dev/${{ env.REPO_NAME }}-frontend-static:${{ steps.get-latest-tag.outputs.tag }} ${{ env.NAMESPACE }}-test/${{ env.REPO_NAME }}-frontend-static:${{ steps.get-latest-tag.outputs.tag }}
          oc tag ${{ env.NAMESPACE }}-dev/${{ env.REPO_NAME }}-backend-${{ env.BRANCH }}:${{ steps.get-latest-tag.outputs.tag }} ${{ env.NAMESPACE }}-test/${{ env.REPO_NAME }}-backend-${{ env.BRANCH }}:${{ steps.get-latest-tag.outputs.tag }}

          # Process templates
          oc process -f tools/openshift/backend.deployment.yaml -p APP_NAME=${{ env.APP_NAME }} -p REPO_NAME=${{ env.REPO_NAME }} -p BRANCH=${{ env.BRANCH }} -p NAMESPACE=${{ env.OPENSHIFT_NAMESPACE }} -p TAG=${{ steps.get-latest-tag.outputs.tag }} -p MIN_REPLICAS=${{ env.MIN_REPLICAS }} -p MAX_REPLICAS=${{ env.MAX_REPLICAS }} -p MIN_CPU=${{ env.MIN_CPU }} -p MAX_CPU=${{ env.MAX_CPU }} -p MIN_MEM=${{ env.MIN_MEM }} -p MAX_MEM=${{ env.MAX_MEM }} -p HOST_ROUTE=${{ env.HOST_ROUTE }} | oc apply -f -

          oc process -f tools/openshift/frontend-static.deployment.yaml -p APP_NAME=${{ env.APP_NAME }} -p REPO_NAME=${{ env.REPO_NAME }} -p BRANCH=${{ env.BRANCH }} -p NAMESPACE=${{ env.OPENSHIFT_NAMESPACE }} -p TAG=${{ steps.get-latest-tag.outputs.tag }} -p MIN_REPLICAS=${{ env.MIN_REPLICAS }} -p MAX_REPLICAS=${{ env.MAX_REPLICAS }} -p MIN_CPU=${{ env.MIN_CPU }} -p MAX_CPU=${{ env.MAX_CPU }} -p MIN_MEM=${{ env.MIN_MEM }} -p MAX_MEM=${{ env.MAX_MEM }} -p HOST_ROUTE=${{ env.HOST_ROUTE }} -p CA_CERT="${{ env.CA_CERT }}" -p CERTIFICATE="${{ env.CERTIFICATE }}" -p PRIVATE_KEY="${{ env.PRIVATE_KEY }}" | oc apply -f -

          bash tools/config/update-configmap.sh test ${{ env.APP_NAME }} ${{ env.NAMESPACE }} ${{env.COMMON_NAMESPACE}} ${{secrets.KC_CLIENT_ID}} ${{secrets.KC_CLIENT_SECRET}} ${{secrets.KC_TOKEN_URL}} ${{secrets.CLEAR_FILES_KEY}} ${{ env.HOST_ROUTE}}

          oc rollout restart deployment/${{ env.IMAGE_NAME }} 2> /dev/null || true
          oc rollout restart deployment/${{ env.APP_NAME_FRONTEND_MASTER }} 2> /dev/null || true
          
          oc rollout status deployment/${{ env.IMAGE_NAME }}

      - name: ZAP Scan
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: "https://${{ env.HOST_ROUTE }}"